arxiv:
  enabled: true
  categories:
    - cs.AI
    - cs.CL
    - cs.CV
    - cs.LG
  max_results: 30
  sort_by: submittedDate
  max_age_hours: 72

reddit:
  enabled: true
  # OpenCLI Reddit 搜索驱动：这些词会直接作为搜索词使用
  search_queries:
    - OpenAI Codex
    - Claude Code
    - Gemini CLI
    - DeepSeek
    - MCP
    - Cursor
    - AI agent
    - local LLM
  # 兼容字段：当 search_queries 为空时才会回退使用
  subreddits:
    - MachineLearning
    - artificial
    - ChatGPT
    - LocalLLaMA
  limit: 25
  # OpenCLI reddit search 不返回精确发布时间，必须限制搜索窗口，避免旧帖被当成新帖。
  time_filter: day
  sort: top
  max_age_hours: 72
  # Minimum upvotes for a post to be included
  # Posts below this threshold are filtered out
  min_score: 20

twitter:
  enabled: true
  max_age_hours: 72
  accounts:
    # AI 公司官方
    - OpenAI
    - GoogleAI
    - AnthropicAI
    - GoogleDeepMind
    - Grok
    - zhipu_ai
    - MiniMax_AI
    - kimi_moonshot
    - deepseek_ai
    - THUDM
    - Xiaomi
    - XiaomiMimo
    # AI 工具 / Agent 项目
    - anthropic
    - claudecode
    - Codex
    - OpenClaude
    - OpenClawAI
    - LangChainAI
    - LangChain
    - AutoGPT
    - CrewAIInc
    - manus_ai
    - DevinAI
    - Replit
    - Vercel
    # AI 大佬个人账号
    - elonmusk
    - sama
    - ylecun
    - karpathy
    - AndrewYNg
    - goodfellow_ian
    - hardmaru
    - jeffdean
    - sundarpichai
    - demishassabis
    - jackclarksf       # Anthropic cofounder, AI newsletter author
    # 从媒体分析中发现的活跃账号 (2026-04)
    - lifeof_jer        # AI研究者，Cursor相关
    - teortaxesTex      # DeepSeek相关
    - mitchellh         # Ghostty作者
    - Reuters           # 科技新闻
    - virushuo          # AI评论
  limit: 30
  filter_ai_only: true
  nitter_instances:
    - https://nitter.net
    - https://nitter.privacydev.net

huggingface:
  enabled: false
  url: https://huggingface.co/papers
  max_results: 25
  max_age_hours: 72

modelscope:
  enabled: false
  url: https://modelscope.cn/models
  max_results: 20
  max_age_hours: 72

github:
  enabled: true
  languages:
    - python
    - typescript
  topics:
    - llm
    - ai-agent
    - coding-assistant
    - mcp
    - rag
    - vision-language-model
    - autonomous-agent
    - robotics
  topic_limit: 5
  min_stars: 50
  max_results: 25
  max_age_hours: 72

china_ai:
  enabled: false
  sources: []
  max_results: 15
  max_age_hours: 72
  per_page: 30
  max_articles_per_source: 20
  filter_companies: true

aihot:
  enabled: true
  feeds:
    - https://aihot.virxact.com/feed.xml
    - https://aihot.virxact.com/feed/all.xml
  max_results: 30
  max_age_hours: 48

changelog:
  enabled: true
  sources:
    # 官网 changelog（需要 Playwright，不稳定，暂时禁用）
    - name: claude-code
      tool_name: Claude Code
      url: https://code.claude.com/docs/en/changelog
      type: claude_docs
      enabled: false
      javascript: true
      wait_selector: "main"
    - name: cursor
      tool_name: Cursor
      url: https://www.cursor.com/changelog
      type: cursor_blog
      enabled: false
      javascript: true
      wait_selector: "main"
    - name: codex-github
      tool_name: OpenAI Codex
      url: https://github.com/openai/codex/releases
      type: github_releases
      repo: openai/codex
      enabled: true
    - name: claude-code-github
      tool_name: Claude Code
      url: https://github.com/anthropics/claude-code/releases
      type: github_releases
      repo: anthropics/claude-code
      enabled: true
  max_results: 20
  max_age_hours: 72
  timeout: 30
