default: gemini
fallbacks:
  gemini: [chatgpt, deepseek, doubao]
  chatgpt: [gemini, deepseek, doubao]
  deepseek: [gemini, chatgpt, doubao]
  doubao: [gemini, chatgpt, deepseek]
providers:
  gemini:
    protocol: opencli
    site: gemini
    timeout: 180
    new: true
  chatgpt:
    protocol: opencli
    site: chatgpt
    timeout: 180
    new: true
  deepseek:
    protocol: opencli
    site: deepseek
    model: expert
    timeout: 180
    new: true
  doubao:
    protocol: opencli
    site: doubao
    timeout: 180
  vision:
    protocol: opencli
    site: deepseek
    model: vision
    timeout: 180
    new: true
  image:
    enabled: true
    protocol: opencli
    site: gemini
    fallbacks: [chatgpt]
    timeout: 360
